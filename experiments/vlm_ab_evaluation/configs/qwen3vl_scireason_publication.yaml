schema_version: 1

experiment:
  id: qwen3vl-8b-scireason-task3-ab-v1
  public_id: study-2026-07-v1
  seed: 20260716
  require_clean_code: true
  require_preregistered_plan: true
  output_dir: runs/vlm_ab/qwen3vl-8b-scireason-task3-ab-v1

benchmark:
  repo_id: top-papers/top-papers-graph-benchmark
  revision: 33ccc5ed08e314c6457dcaa23e7f7508406cb4f8
  data_file: data/task3_vlm_generation.jsonl
  provenance_file: article_image_sources.jsonl
  # Semantic scoring is a blinded expert endpoint. Set true after adjudicated
  # gold answers/rubrics are added if automatic semantic metrics are claimed.
  require_gold: false
  require_complete_provenance: true
  require_split_provenance: true

# These are the exact SFT/GRPO exports at evaluated adapter revision R, not an
# inferred split from the generic Dataset Viewer configuration.
training_audit:
  # The published adapter does not yet provide the required full source/image/
  # creator lineage manifest. Its absence is an intentional strict gate blocker.
  require_lineage_manifest: true
  # After publishing corrected revision R, add lineage_manifest here from the
  # same repo_id at a distinct later attestation revision M. The manifest at M
  # declares the training exports at R; models.tuned.adapter remains pinned to R.
  sources:
    - repo_id: top-papers/Qwen3-VL-8B-Instruct-scireason
      repo_type: model
      revision: 45936868f4b2acdbbc4245044137072411fd11cc
      files:
        - artifacts/data/sft_all.jsonl
        - artifacts/data/grpo_all.jsonl

models:
  base:
    base_model:
      id: Qwen/Qwen3-VL-8B-Instruct
      revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
    model_kwargs:
      torch_dtype: bfloat16
      device_map: auto
      low_cpu_mem_usage: true
      attn_implementation: sdpa
      trust_remote_code: false
  tuned:
    base_model:
      id: Qwen/Qwen3-VL-8B-Instruct
      revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
    adapter:
      id: top-papers/Qwen3-VL-8B-Instruct-scireason
      revision: 45936868f4b2acdbbc4245044137072411fd11cc
      adapter_name: default
    model_kwargs:
      torch_dtype: bfloat16
      device_map: auto
      low_cpu_mem_usage: true
      attn_implementation: sdpa
      trust_remote_code: false

# The adapter repository processor is deliberately shared by both arms so image
# resizing, chat template, tokenizer, and special tokens cannot confound the A/B.
processor:
  id: top-papers/Qwen3-VL-8B-Instruct-scireason
  revision: 45936868f4b2acdbbc4245044137072411fd11cc
  settings:
    max_pixels: 1003520
    trust_remote_code: false
  call_settings:
    padding: true
  chat_template_settings:
    add_vision_id: false

# Prespecified primary decoding policy. Sampled generations, if reported, must
# use separate output files/config fingerprints and are sensitivity analyses.
generation:
  do_sample: false
  max_new_tokens: 768
  use_cache: true

conditions:
  - original
  - text_only
  - shuffled_images

review:
  reviewer_ids:
    - expert-01
    - expert-02
    - expert-03
  reviews_per_item: 2
  primary_condition: original

statistics:
  primary_condition: original
  primary_endpoint_only: true
  primary_strata:
    - multimodal_hard
    - temporal_hard
  confidence_level: 0.95
  bootstrap_resamples: 10000
  randomization_resamples: 100000
  exact_max_clusters: 16

# Conservative normal-approximation planning values. n_items is interpreted as
# independent paper-level units because the primary estimator is paper-macro.
power:
  n_items: 240
  reviews_per_item: 2
  evaluable_fraction: 0.90
  intracluster_correlation: 0.50
  alpha: 0.05
  target_power: 0.80
  score_sd: 0.50
  target_effect: 0.10
