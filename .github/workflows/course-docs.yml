name: Course docs

on:
  push:
    branches: [main]
    paths:
      - 'course/**'
      - 'docs/course/**'
      - 'notebooks/**'
      - 'scripts/ci/validate_course_docs.py'
      - '.github/workflows/course-docs.yml'
  pull_request:
    paths:
      - 'course/**'
      - 'docs/course/**'
      - 'notebooks/**'
      - 'scripts/ci/validate_course_docs.py'
      - '.github/workflows/course-docs.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate course documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Check the course stays coherent
        run: python3 scripts/ci/validate_course_docs.py

      - name: Check the machine-readable syllabus parses
        run: python3 -c "import json; json.load(open('docs/course/syllabus.json'))"

      - name: Self-test the validator on a deliberately broken copy
        run: |
          # The validator must FAIL when the course is inconsistent; a check
          # that cannot fail is not a check.
          #
          # The copy includes EVERY path the validator reads, otherwise it
          # would fail for an unrelated reason and the step would pass while
          # proving nothing. It also asserts the healthy copy first, so a
          # broken validator cannot masquerade as a working one.
          set -e
          tmp="$(mktemp -d)"
          cp -r course docs notebooks scripts "$tmp/"
          # Top-level files the course docs link to.
          cp CONTRIBUTING.md LICENSE LICENSE_SCOPE.md README.md AGENTS.md "$tmp/" 2>/dev/null || true
          cd "$tmp"

          if ! python3 scripts/ci/validate_course_docs.py >/dev/null; then
            echo "validator rejects the intact copy - it is broken"
            exit 1
          fi

          rm course/weeks/week07.md
          if python3 scripts/ci/validate_course_docs.py >/dev/null 2>&1; then
            echo "validator passed after a week module was deleted"
            exit 1
          fi

          # A broken relative link must also be caught.
          git checkout -- course/weeks/week07.md 2>/dev/null || true
          printf '\n[битая](no-such-file.md)\n' >> course/weeks/week07.md
          if python3 scripts/ci/validate_course_docs.py >/dev/null 2>&1; then
            echo "validator passed with a broken link"
            exit 1
          fi

          echo "validator catches both a missing module and a broken link"

  tests:
    name: Course artifact tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install the package WITH its runtime dependencies: the course
          # tests import project code, so a dependency-free install fails at
          # collection with ModuleNotFoundError instead of testing anything.
          # The heavy optional extras (torch, GNN, VLM) are not installed --
          # the selected test files do not need them.
          pip install -e .

      - name: Run the course artifact tests
        # Only the fast, dependency-light tests that cover course artifacts
        # and their contracts. The full suite needs torch, model weights and
        # a GPU, so it cannot run on every push to a documentation file --
        # and a CI that takes an hour is a CI nobody reads.
        #
        # The selection is verified against a clean venv containing only
        # this project's own dependencies: every file listed here must pass
        # there, otherwise CI fails for a reason unrelated to the change.
        # tests/test_task2_topology_and_filters.py is deliberately excluded:
        # it needs scipy, which is not a dependency of this project.
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_templates_exist.py \
            tests/test_graph_candidate_agent_hardening.py \
            tests/test_assertion_scorer.py \
            tests/test_chunk_contracts.py \
            tests/test_llm_json_repair.py
